version: "3.9"

services:
  web:
    image: egorsdf/myapp:b06d865f669263e7054fbee99461c7d261362ed0
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/code
      - static_volume:/code/staticfiles
    ports:
      - "8080:8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "pg-isready -h db -U $POSTGRES_USER" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'

  celery:
    image: egorsdf/myapp:b06d865f669263e7054fbee99461c7d261362ed0
    command: celery -A config worker -l INFO -P eventlet
    volumes:
      - .:/code
    depends_on:
      - db
      - redis
      - web
    env_file:
      - .env

  celery-beat:
    image: egorsdf/myapp:b06d865f669263e7054fbee99461c7d261362ed0
    command: celery -A config beat -l INFO
    volumes:
      - .:/code
    depends_on:
      - db
      - redis
      - web
    env_file:
      - .env

volumes:
  postgres_data:
  static_volume:
