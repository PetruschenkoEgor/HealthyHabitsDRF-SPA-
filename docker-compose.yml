version: "3.9"

services:
  web:
    image: egorsdf/myapp:${TAG}
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/code
      - static_volume:/code/staticfiles
    expose:
      - "8000"
    depends_on:
      - db
      - redis
    networks:
      - my_network
    env_file:
      - .env

  nginx:
    image: egorsdf/nginx:${TAG}
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./html:/usr/share/nginx/html
    networks:
      - my_network
    dns:
      - 127.0.0.11
    env_file:
      - .env

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    networks:
      - my_network
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "pg-isready -h db -U $POSTGRES_USER" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    volumes:
      - redis_data:/data
    networks:
      - my_network

  celery:
    image: egorsdf/myapp:${TAG}
    command: celery -A config worker -l INFO -P eventlet
    volumes:
      - .:/code
    depends_on:
      - db
      - redis
      - web
    networks:
      - my_network
    env_file:
      - .env

  celery-beat:
    image: egorsdf/myapp:${TAG}
    command: celery -A config beat -l INFO
    volumes:
      - .:/code
    depends_on:
      - db
      - redis
      - web
    networks:
      - my_network
    env_file:
      - .env

networks:
  my_network:
    driver: bridge

volumes:
  postgres_data:
  static_volume:
  redis_data:
